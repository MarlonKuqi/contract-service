# Port aléatoire pour éviter les conflits lors de l'exécution parallèle des tests
server:
  port: 0

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.mk.contractservice: DEBUG



spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.test/realms/contract-service
          jwk-set-uri: https://keycloak.test/realms/contract-service/protocol/openid-connect/certs
          audiences: contract-service
