spring:
  docker:
    compose:
      enabled: true

  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springdoc: DEBUG
    com.mk.contractservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

