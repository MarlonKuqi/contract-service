name: CI Pipeline

on:
  push:
    branches: [ master, develop, 'release/**' ]
  pull_request:
  workflow_dispatch:
    inputs:
      build-image:
        description: 'Build and scan the Docker image'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-tests:
    name: Build, Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    outputs:
      docker-changed: ${{ steps.docker-changes.outputs.changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Docker-related changes
        id: docker-changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -vE '\.md$' | grep -qE '^([^/]+|\.mvn/.*)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'zulu'
          cache: maven

      - name: Check formatting (Spotless)
        run: sh mvnw -B spotless:check -Dspotless.ratchet-from="$RATCHET_FROM"
        env:
          RATCHET_FROM: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'origin/develop' }}

      - name: Compile
        run: sh mvnw -B clean test-compile

      - name: Run unit tests with coverage report
        run: sh mvnw -B test

      - name: Unit test summary
        if: always()
        run: bash .github/scripts/test-summary.sh "Unit tests" target/surefire-reports

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: Code Coverage Report
          update-comment: true

  acceptance-tests:
    name: Acceptance Tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'zulu'
          cache: maven

      - name: Run acceptance tests
        run: sh mvnw -B test-compile failsafe:integration-test failsafe:verify

      - name: Acceptance test summary
        if: always()
        run: bash .github/scripts/test-summary.sh "Acceptance tests" target/failsafe-reports

      - name: Upload acceptance test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-test-results
          path: target/failsafe-reports/
          retention-days: 14
          if-no-files-found: ignore

  mutation-tests:
    name: Mutation Tests (PIT)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: unit-tests
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'zulu'
          cache: maven

      - name: Run mutation tests on domain and features
        run: sh mvnw -B test -Pmutation -Djacoco.skip=true

      - name: Mutation summary
        if: always()
        run: |
          bash .github/scripts/mutation-summary.sh target/pit-reports/mutations.xml mutation-summary.md
          cat mutation-summary.md >> "$GITHUB_STEP_SUMMARY"
        env:
          DIFF_RANGE: ${{ github.event_name == 'pull_request' && 'HEAD^1..HEAD' || '' }}

      - name: Comment PR with mutation summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('target/pit-reports/mutations.xml') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: mutation-testing
          path: mutation-summary.md

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: target/pit-reports/
          retention-days: 14
          if-no-files-found: ignore

  docker-image:
    name: Docker Image Build & Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests
    if: github.event_name == 'push' || inputs.build-image || needs.unit-tests.outputs.docker-changed == 'true'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: contract-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'contract-service:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.4
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-image'
