spring:
  application:
    name: contract-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: contracts
        jdbc:
          batch_size: 1000
  datasource:
    hikari:
      connection-init-sql: SET lock_timeout = '${app.database.lock-timeout}'
      data-source-properties:
        reWriteBatchedInserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: contracts
  docker:
    compose:
      enabled: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
      table-prefix: contracts.BATCH_
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
      resolve-lazily: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/contract-service}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/contract-service/protocol/openid-connect/certs}
          audiences: ${KEYCLOAK_AUDIENCE:contract-service}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

info:
  app:
    name: '@project.name@'
    version: '@project.version@'
    description: Contract Management Service

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
app:
  time-zone: Europe/Zurich
  database:
    lock-timeout: 5s
  contract-import:
    worker-enabled: true
    poll-delay: PT2S
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
